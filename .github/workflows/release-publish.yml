# The second half of the release flow — see release.yml for the first.
#
# Merging a `release/v…` pull request triggers this workflow, which builds,
# signs, notarizes and publishes the app. Triggering off the merge (rather
# than the push it causes) means there is no guessing from commit messages or
# changed paths: the head ref names the tag, and the pull request body carries
# the channel and draft flag that were chosen when the release was started.
#
# A `release/` branch merged by hand without the metadata block fails loudly
# here instead of publishing something half-described.
name: Release Publish

on:
  pull_request:
    types: [closed]

# Creates the tag and publishes the release.
permissions:
  contents: write

concurrency:
  # Serializes against release.yml's prepare job: two releases at once would
  # race for the same tag.
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    # macOS is not a preference here: the .app, the DMG, codesign and
    # notarytool all need it.
    runs-on: macos-14
    # Attach Apple credentials to an environment rather than to the repository,
    # so they are only readable by this workflow — and so a required reviewer
    # can be configured on it without touching this file. Any approval gate on
    # the environment fires here too, after code review has already passed.
    environment: release
    timeout-minutes: 90

    steps:
      - name: Check out the merged default branch
        uses: actions/checkout@v4
        with:
          # The merge result is what ships: checkout main explicitly, because
          # a closed-pull-request event does not point at it.
          ref: main
          # Release notes are generated from the commits since the previous
          # tag, so a shallow clone would have nothing to read.
          fetch-depth: 0

      - name: Read the release metadata back
        id: meta
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # Branch name is release/<tag>; everything else derives from that.
          tag="${HEAD_REF#release/}"
          version="${tag#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' (from $HEAD_REF) is not a semantic version" >&2
            exit 1
          fi

          meta="$(sed -n '/^<!-- release-metadata/,/^-->$/p' <<<"$PR_BODY" | sed '1d;$d')"
          if [[ -z "$meta" ]]; then
            echo "::error::no release-metadata block in the pull request body — this branch was not opened by the Release workflow" >&2
            exit 1
          fi

          channel="$(awk '/^channel:/ { print $2 }' <<<"$meta")"
          draft="$(awk '/^draft:/ { print $2 }' <<<"$meta")"
          recorded_version="$(awk '/^version:/ { print $2 }' <<<"$meta")"

          [[ "$channel" == "beta" || "$channel" == "stable" ]] || { echo "::error::unknown channel '$channel'" >&2; exit 1; }
          [[ "$draft" == "true" || "$draft" == "false" ]] || { echo "::error::unknown draft flag '$draft'" >&2; exit 1; }

          # The whole point of the pull request was to put this version in the
          # tree; if the two disagree, something edited one of them.
          manifest_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          [[ "$manifest_version" == "$version" ]] || {
            echo "::error::Cargo.toml says $manifest_version but the release branch says $version" >&2
            exit 1
          }
          [[ "$recorded_version" == "$version" ]] || {
            echo "::error::pull request body says $recorded_version but the branch is $version" >&2
            exit 1
          }

          # A stable release cannot be a pre-release version — the suffix is
          # what keeps a beta away from stable users in the update checker.
          if [[ "$channel" == "stable" && "$version" == *-* ]]; then
            echo "::error::a stable release cannot be a pre-release version ($version)" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists" >&2
            exit 1
          fi

          target_sha="$(git rev-parse HEAD)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag on the $channel channel (draft: $draft) at $target_sha"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # GPUI is pulled from git and dominates the build; keying on the
          # channel keeps beta and stable from evicting each other. Same key
          # scheme as before the split, so existing caches still hit.
          key: release-${{ steps.meta.outputs.channel }}

      - name: Run the tests
        run: cargo test --release --locked

      # Secrets never reach the disk in plain form and never appear in a log:
      # GitHub masks them in output, the certificate is written to a RUNNER_TEMP
      # file that is deleted below, and the keychain is created for this job.
      - name: Import the signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CERTIFICATE_P12:-}" ]]; then
            echo "No signing certificate configured — this will be an unsigned build"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without an interactive prompt, which
          # would otherwise hang the job forever.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          rm -f "$certificate"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Write the notarization key
        id: notary
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${API_KEY:-}" ]]; then
            echo "No notarization key configured — the build will not be notarized"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key_path="$RUNNER_TEMP/notary.p8"
          echo -n "$API_KEY" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build the app and DMG
        id: bundle
        env:
          # Empty when the secrets are absent, which is exactly how the script
          # decides between an unsigned and a signed build.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ steps.notary.outputs.key_path }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.trongduong.mole' }}
          # Stamped in so a fork's builds check the fork's releases.
          DRIFT_UPDATE_REPO: ${{ github.repository }}
        run: |
          scripts/bundle-macos.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --channel "${{ steps.meta.outputs.channel }}"

      - name: Verify the DMG opens and carries the right metadata
        env:
          DMG: ${{ steps.bundle.outputs.dmg_path }}
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          mount_point="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
          plist="$mount_point/Mole.app/Contents/Info.plist"

          version="$(/usr/libexec/PlistBuddy -c 'Print :MoleReleaseVersion' "$plist")"
          channel="$(/usr/libexec/PlistBuddy -c 'Print :MoleReleaseChannel' "$plist")"
          echo "Bundle reports $version on the $channel channel"

          # The artifact and the release must agree about what they are: this
          # is the metadata a user inspects on a downloaded build.
          [[ "$version" == "$EXPECTED_VERSION" ]] || { echo "::error::bundle version $version != $EXPECTED_VERSION"; exit 1; }
          [[ "$channel" == "$EXPECTED_CHANNEL" ]] || { echo "::error::bundle channel $channel != $EXPECTED_CHANNEL"; exit 1; }

          if [[ "${{ steps.signing.outputs.available }}" == "true" ]]; then
            codesign --verify --deep --strict "$mount_point/Mole.app"
            if [[ "${{ steps.notary.outputs.available }}" == "true" ]]; then
              # The check Gatekeeper itself runs on first launch.
              spctl --assess --type execute --verbose "$mount_point/Mole.app"
            fi
          fi

          hdiutil detach "$mount_point" >/dev/null

      - name: Generate the release notes
        id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          .github/scripts/release-notes.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --channel "${{ steps.meta.outputs.channel }}" > "$notes_file"
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"
          {
            echo "### Release notes for ${{ steps.meta.outputs.tag }}"
            echo
            cat "$notes_file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          DMG: ${{ steps.bundle.outputs.dmg_path }}
          NOTES: ${{ steps.notes.outputs.path }}
          DRAFT: ${{ steps.meta.outputs.draft }}
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
        run: |
          set -euo pipefail
          args=(--title "Mole $VERSION" --notes-file "$NOTES" --target "$TARGET_SHA")

          # The pre-release flag is what the update checker reads to keep a
          # beta away from stable users.
          if [[ "$CHANNEL" == "beta" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          # A draft is published by hand afterwards, which is the review step:
          # drafts are invisible to the API the checker reads, so nobody is
          # offered a release still being edited.
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi

          gh release create "$TAG" "$DMG" "${args[@]}"
          echo "Published $TAG ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          rm -f "$RUNNER_TEMP/notary.p8"
