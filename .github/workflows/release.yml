# Releases happen in two phases.
#
# Phase 1 — this workflow. A maintainer dispatches it with a channel and an
# optional version; it resolves the version, stamps it into Cargo.toml,
# commits that to a `release/v…` branch and opens a pull request against the
# default branch. Nothing is built or published here.
#
# Phase 2 — .github/workflows/release-publish.yml. Merging the pull request
# triggers it, and only it builds, signs and uploads the release. The merge is
# therefore the decision that publishes: it goes through code review like any
# other change, and if the `release` environment has a required reviewer
# configured there is a second gate on top.
#
# Only a maintainer can start this — `workflow_dispatch` is restricted to
# accounts with write access. There is no tag trigger and no release on push.
#
# The channel input is what everything else follows from. `beta` publishes a
# GitHub pre-release, which the in-app checker only offers to users on the Beta
# channel; `stable` publishes a normal release, which everyone is offered. See
# src/core/update.rs for the other half of that contract.
name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        required: true
        default: beta
        options:
          - beta
          - stable
      version:
        description: >-
          Version to release, without the leading v (e.g. 0.2.0, or
          0.2.0-beta.1). Leave empty to use Cargo.toml's version — on the beta
          channel the next free -beta.N suffix is added for you.
        type: string
        required: false
      draft:
        description: "Publish as a draft, so the notes can be edited first"
        type: boolean
        required: false
        default: false

# Creates a branch and a pull request. The default branch itself is only
# changed by someone merging that request.
permissions:
  contents: write
  pull-requests: write

concurrency:
  # Two releases at once would race for the same tag.
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Open the release pull request (${{ inputs.channel }})
    # Git, sed and a cargo re-lock are all this job needs — no macOS tools, so
    # it runs on the cheaper Linux runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # The next free `-beta.N` suffix is found by looking at existing
          # tags, so a shallow clone would pick one already taken.
          fetch-depth: 0

      - name: Resolve the version and tag
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$REQUESTED"
          if [[ -z "$version" ]]; then
            version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          version="${version#v}"

          # Semver, with an optional pre-release and build suffix. Anything
          # else would produce a tag the update checker cannot parse, and so a
          # release nobody is ever offered.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version" >&2
            exit 1
          fi

          if [[ "$CHANNEL" == "beta" ]]; then
            # A beta must carry a pre-release suffix — that suffix is what
            # keeps it away from stable users even if the pre-release flag is
            # ever set wrong. Add the next free one when it has none.
            if [[ "$version" != *-* ]]; then
              n=1
              while git rev-parse -q --verify "refs/tags/v$version-beta.$n" >/dev/null; do
                n=$((n + 1))
              done
              version="$version-beta.$n"
            fi
          else
            if [[ "$version" == *-* ]]; then
              echo "::error::a stable release cannot be a pre-release version ($version)" >&2
              exit 1
            fi
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing $tag on the $CHANNEL channel"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: prepare-${{ inputs.channel }}

      - name: Stamp the version into the build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The binary reports env!("CARGO_PKG_VERSION"), so this is what makes
          # a running app compare itself against the right release. Unlike the
          # tag, the version lives in the tree — committing it here is what
          # lets the publish workflow read it back after the merge.
          awk -v v="$VERSION" '/^version = / && !done { print "version = \"" v "\""; done = 1; next } { print }' \
            Cargo.toml > Cargo.toml.stamped
          mv Cargo.toml.stamped Cargo.toml

          # Re-lock the workspace member only, so the `--locked` build in the
          # publish workflow still agrees with the manifest and no dependency
          # moves underneath us between here and there.
          cargo update --workspace --offline || cargo update --workspace

          grep -m1 '^version' Cargo.toml

      - name: Generate the release notes
        id: notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          .github/scripts/release-notes.sh \
            --version "${{ steps.version.outputs.version }}" \
            --channel "${{ inputs.channel }}" > "$notes_file"
          {
            echo "### Release notes for ${{ steps.version.outputs.tag }}"
            echo
            cat "$notes_file"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Commit the version bump to a release branch
        id: branch
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          branch="release/$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): prepare $TAG ($CHANNEL)"
          git push origin "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open the release pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          DRAFT: ${{ inputs.draft }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          NOTES: ${{ steps.notes.outputs.path }}
          BASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"

          # Machine-readable record of what this release is. The publish
          # workflow reads these values back out of the merged pull request,
          # which is how the channel survives the trip without another input.
          {
            echo "<!-- release-metadata"
            echo "channel: $CHANNEL"
            echo "version: $VERSION"
            echo "tag: $TAG"
            echo "draft: $DRAFT"
            echo "-->"
            echo
            echo "## Release $TAG"
            echo
            echo "Merging this pull request builds and publishes **Mole $VERSION** on the **$CHANNEL** channel."
            echo
            echo "### Release notes"
            echo
            cat "$NOTES"
          } > "$body_file"

          pr_url="$(gh pr create \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "Release $TAG ($CHANNEL)" \
            --body-file "$body_file")"

          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Release pull request ready"
            echo
            echo "[Open the pull request]($pr_url) — merging it starts the build and publish."
          } >> "$GITHUB_STEP_SUMMARY"
